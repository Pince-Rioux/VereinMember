name: build

on:
  push:
    branches: [ main, feature/*, fix/*, test/* ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Add NuGet sources
        run: |
          dotnet nuget source add "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name github \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" || true

      - name: Restore
        run: dotnet restore VereinMember.sln

      - name: Build
        run: dotnet build VereinMember.sln --no-restore --configuration Release

      - name: Install Playwright browser
        run: pwsh tests/VereinMember.E2ETests/bin/Release/net8.0/playwright.ps1 install --with-deps chromium

      - name: Test
        run: dotnet test VereinMember.sln --no-build --configuration Release --verbosity minimal

      - name: Pack
        run: dotnet pack src/VereinMember/VereinMember.csproj --no-build --configuration Release -o .nupkg-test
