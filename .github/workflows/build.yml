name: build

on:
  push:
    branches: [ main, feature/*, fix/*, test/* ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        env:
          NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ github.token }};ValidAuthenticationTypes=Basic
        run: dotnet restore VereinMember.slnx --verbosity minimal

      - name: Build
        run: dotnet build VereinMember.slnx --no-restore --configuration Release --verbosity minimal

      - name: Install Playwright browser
        run: pwsh tests/VereinMember.E2ETests/bin/Release/net8.0/playwright.ps1 install --with-deps chromium

      - name: Test
        run: dotnet test VereinMember.slnx --no-build --configuration Release --verbosity minimal

      - name: Pack
        run: dotnet pack src/VereinMember/VereinMember.csproj --no-build --configuration Release -o .nupkg-test
