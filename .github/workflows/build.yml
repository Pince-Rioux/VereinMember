name: build

on:
  push:
    branches: [ main, feature/*, fix/* ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0

      - name: Add NuGet sources
        run: |
          dotnet nuget source add "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name github \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" || true
          dotnet nuget source add ../../ClubSite/LocalPackages \
            --name LocalPackages || true

      - run: dotnet restore
        working-directory: src/VereinMember

      - run: dotnet build --no-restore
        working-directory: src/VereinMember