name: build

on:
  push:
    branches: [ main, feature/*, fix/* ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0

      - run: dotnet restore
        working-directory: src/VereinMember

      - run: dotnet build --no-restore
        working-directory: src/VereinMember