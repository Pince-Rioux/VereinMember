name: build

on:
  push:
    branches: [ main, feature/*, fix/* ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Add NuGet sources
        run: |
          dotnet nuget source add "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name github \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" || true

      - name: Restore
        run: dotnet restore tests/VereinMember.Tests/VereinMember.Tests.csproj

      - name: Build
        run: dotnet build tests/VereinMember.Tests/VereinMember.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/VereinMember.Tests/VereinMember.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Pack
        run: dotnet pack src/VereinMember/VereinMember.csproj --no-build --configuration Release -o .nupkg-test
