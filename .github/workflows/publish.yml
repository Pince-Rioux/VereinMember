name: publish

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0

      - name: Restore
        run: dotnet restore
        working-directory: src/VereinMember

      - name: Build
        run: dotnet build --no-restore
        working-directory: src/VereinMember

      - name: Package
        run: dotnet pack --no-restore
        working-directory: src/VereinMember

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REGISTRY="https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

          echo "actor:        ${{ github.actor }}"
          echo "owner:        ${{ github.repository_owner }}"
          echo "registry:     $REGISTRY"

          # Diagnostics: is the registry reachable and does the token authenticate?
          index_code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" "$REGISTRY")
          echo "registry index status: $index_code"

          nupkg=$(find src -name '*.nupkg' -print -quit)
          if [ -z "$nupkg" ]; then
            echo "::error::No .nupkg produced by dotnet pack"
            exit 1
          fi
          echo "package:      $nupkg"

          dotnet nuget push "$nupkg" \
            --source "$REGISTRY" \
            --api-key "$GITHUB_TOKEN" \
            --skip-duplicate