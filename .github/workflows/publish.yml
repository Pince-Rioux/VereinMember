name: publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer package version to publish (e.g. 1.0.0-rc.1 or 1.0.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate version
        env:
          PKG_VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$PKG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid SemVer package version: '$PKG_VERSION'"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Add NuGet sources
        run: |
          dotnet nuget source add "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name github \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" || true

      - name: Restore
        run: dotnet restore VereinMember.slnx --verbosity minimal

      - name: Build
        run: dotnet build VereinMember.slnx --no-restore --configuration Release --verbosity minimal

      - name: Install Playwright browser
        run: pwsh tests/VereinMember.E2ETests/bin/Release/net8.0/playwright.ps1 install --with-deps chromium

      - name: Test
        run: dotnet test VereinMember.slnx --no-build --configuration Release --verbosity minimal

      - name: Pack
        env:
          PKG_VERSION: ${{ inputs.version }}
        run: |
          dotnet pack src/VereinMember/VereinMember.csproj \
            --no-build \
            --configuration Release \
            -p:PackageVersion="$PKG_VERSION" \
            -o .nupkg-release

      - name: Publish to GitHub Packages
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          PKG_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          SRC="https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          nupkg=".nupkg-release/VereinMember.${PKG_VERSION}.nupkg"
          [ -f "$nupkg" ] || { echo "::error::Package not found: $nupkg"; exit 1; }
          echo "package: $nupkg"
          dotnet nuget push "$nupkg" \
            -s "$SRC" \
            -k "$GH_PAT" \
            --skip-duplicate
