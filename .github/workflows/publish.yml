name: publish

on:
  push:
    branches: [ main ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0

      - name: Restore
        run: dotnet restore
        working-directory: src/VereinMember

      - name: Build
        run: dotnet build --no-restore
        working-directory: src/VereinMember

      - name: Package
        run: dotnet pack --no-restore
        working-directory: src/VereinMember

      - name: Publish to GitHub Packages
        run: |
          # Configure NuGet source with GITHUB_TOKEN (has write:packages scope)
          dotnet nuget add source \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            -n github \
            -u "${{ github.actor }}" \
            -p "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text
          # Locate and push the package
          nupkg=$(find src -name '*.nupkg' 2>/dev/null | head -1)
          if [ -z "$nupkg" ]; then
            echo "No .nupkg found" >&2
            exit 1
          fi
          echo "Publishing: $nupkg"
          dotnet nuget push "$nupkg" -source "github"