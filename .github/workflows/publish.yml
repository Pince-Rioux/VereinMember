name: publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish"
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0

      - name: Build package
        working-directory: src/VereinMember
        run: |
          dotnet restore
          dotnet build --no-restore
          dotnet pack --no-restore

      - name: Publish to GitHub Packages
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          SRC="https://nuget.pkg.github.com/Pince-Rioux"
          nupkg=$(find src -name '*.nupkg' -print -quit)
          [ -n "$nupkg" ] || { echo "::error::no nupkg"; exit 1; }
          echo "package: $nupkg"
          dotnet nuget push "$nupkg" \
            -s "$SRC" \
            -k "$GH_PAT" \
            --skip-duplicate
